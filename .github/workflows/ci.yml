name: CI

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.1.1' # Specify your exact required version here

    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -project image-loader.xcodeproj \
          -scheme image-loader \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.1' \
          -quiet
