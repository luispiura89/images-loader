name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby with caching
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.6
        bundler-cache: true

    - name: Cache Swift Package Manager
      id: spm-cache
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Cache Xcode derived data
      id: derived-cache
      uses: actions/cache@v6
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj', '**/*.xcworkspace/contents.xcworkspacedata') }}
        restore-keys: |
          ${{ runner.os }}-xcode-deriveddata-

    - name: Cache Status
      run: |
        echo "SPM cache hit: ${{ steps.spm-cache.outputs.cache-hit }}"
        echo "Derived Data cache hit: ${{ steps.derived-cache.outputs.cache-hit }}"

    - name: Run Unit Tests
      run: bundle exec fastlane ci_test

    - name: Upload Tests Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: TestResults
        path: |
            fastlane/test_output/report.junit
            fastlane/test_output/image-loader.xcresult
        retention-days: 2
