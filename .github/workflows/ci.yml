name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.1.1' # Specify your exact required version here

    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -project image-loader.xcodeproj \
          -scheme image-loader \
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
          CODE_SIGNING_ALLOWED=NO \
          -quiet
